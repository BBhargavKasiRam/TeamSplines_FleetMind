name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pip \
            flake8

      - name: Python Linting (flake8)
        run: |
          # Check critical Python scripts for syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=rmf_ws/src/thirdparty,rmf_ws_t/src/thirdparty

      - name: Build Core Edge-AI Packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --base-paths rmf_ws/src/edge_fleet_msgs rmf_ws/src/edge_fleet_core rmf_ws/src/rmf/rmf_edge_ai rmf_ws/src/edge_fleet_bringup \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
