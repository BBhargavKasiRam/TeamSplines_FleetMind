name: "📊 Benchmark Result & Evaluation"
description: Submit empirical performance metrics, stress test data, or dual-fleet comparison evaluations.
title: "[BENCHMARK]: <Scenario Name> (<Fleet Size> AMRs)"
labels: ["benchmark", "analytics"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to record comparative performance data between Edge-AI coordination and traditional central dispatch.
  - type: input
    id: scenario
    attributes:
      label: Scenario / Workload
      description: Name of benchmark scenario executed (e.g., 5-AMR intersecting patrol, putaway, sorting).
      placeholder: "benchmark all"
    validations:
      required: true
  - type: input
    id: fleet_size
    attributes:
      label: Active Fleet Size
      placeholder: "5 AMRs (tinyRobot1 to tinyRobot5)"
    validations:
      required: true
  - type: textarea
    id: metrics_table
    attributes:
      label: Quantitative Performance Data
      description: Enter comparative results (time taken, idle delays, speedup percentage).
      placeholder: |
        | Metric | Baseline (Open-RMF) | Proposed (Edge-AI) | Improvement |
        | :--- | :--- | :--- | :--- |
        | Task Completion Time | 64.1 s | 41.2 s | 35.7% Faster |
        | Idle Standstill Delay | 58.9 s / AMR | 13.2 s / AMR | 77.5% Reduction |
        | Intersection Halts | 111 / AMR | 5.6 / AMR | 95.0% Avoided |
        | Inter-Robot Collisions | 0 | 0 | Zero Collisions |
    validations:
      required: true
  - type: textarea
    id: hardware_profile
    attributes:
      label: Hardware Profile & Resource Utilization
      description: CPU, memory, and network bandwidth observed during the run.
